ידע האישי.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eלצד מדיניות פרטיות זו, התנאים המסדירים את השימוש באתר מוגדרים בתנאי השימוש שלנו.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eאיסוף מידע אישי ומטרות השימוש\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה תאסוף מידע אישי שהלקוחות שיתפו עמה ביודעין ומרצונם החופשי ואשר נחוץ במישרין לצורך השימוש באתר ו/או מתן השירותים על ידי החברה. חשוב להדגיש כי אין כל מחויבות למסור לחברה כל מידע אישי, אך במקרים מסוימים, אי מסירת מידע אישי עשויה למנוע את אפשרות השימוש באתר ו/או מתן שירותים מסוימים המוצעים על ידי החברה ובמקרים כאמור החברה תהא רשאית לסרב למתן שירותים מסוימים.\u003c/p\u003e\u003cp\u003eהשימוש במידע שנאסף, ייעשה רק על פי מדיניות פרטיות זו ו/או על פי הוראות כל דין ובהתאם לשימוש הרלוונטי באתר ו/או בשירותים, לשם מימוש, אחת או יותר, מטרות השימוש הקשורות למתן השירותים על ידי החברה וקידום מטרותיה של החברה, ובפרט כדי לאפשר ללקוחותיה לעשות שימוש בשירותים, וכדי לטייב את שירותי החברה, לרבות לצרכי תפעול, פיתוח, מחקר, בקרה, ניתוח וסטטיסטיקה, התאמת שירותים ללקוחות או סוג לקוחות, צרכי הנהלת חשבונות, טיפול בפניות ותלונות, אבטחת השירות ופרטי לקוחות החברה, ושמירה על קשרי לקוחות ודיוור ישיר (\\\"מטרות השימוש\\\").\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eהחברה עשויה לאסוף מידע אישי בדרכים ולמטרות השימוש, לרבות כמפורט להלן:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• רישום משתמשים: לצורך השימוש בחלק מן השירותים אותם החברה מספקת ללקוחותיה באתר, יידרשו הלקוחות להירשם ובמסגרת זו לספק לחברה פרטי קשר, כגון שם מלא, כתובת דוא\\\"ל, המדינה בה הלקוח נמצא ושפה, שם משתמש וסיסמא. בעת רישום לקוחות לאתר ושיתוף מידע כאמור, על הלקוח מוטלת החובה לבחון את אמיתות המידע הנמסר לחברה, מהימנותו וסמכותו של הלקוח לשתף עם החברה מידע כאמור. כמו כן, כחלק מרישום הלקוחות לשירותי החברה, ולצורך טיוב השירות והתאמתו ללקוח, באפשרות הלקוחות לשתף עם החברה את העדפותיהם ואת תחומי העניין שלהם.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• תשלומים: חלק מהשירותים אותם מספקת החברה כרוכים בתשלום, ובעת השלמת עסקת רכישה כאמור הלקוחות עשויים להידרש לספק נתונים אישיים לצרכי הנהלת חשבונות כגון פרטי התקשרות מלאים לרבות כתובת, מספר מזהה, פרטי תשלום וכיוצא באלה לספקי צד שלישי. התשלומים יבוצעו באמצעות ספקי צד שלישי בלבד, Apple ו-Google, וזאת בהתאם למדיניות של אותם הספקים ובאחריות הבלעדית של אותם הספקים אליהם יופנו לקוחות החברה לצורך ביצוע התשלומים. נתונים אישיים בדבר התשלומים כאמור לא ישותפו עם החברה והחברה לא שומרת במאגרי המידע שלה נתונים אישיים כאמור בדבר התשלומים.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• תגובות (\\\"טוקבקים\\\"): באפשרות לקוחות החברה לפרסם את תגובותיהם באתר בקשר עם הפרסומים והכתבות המופיעות באתר, בעת פרסום תגובה כאמור לקוחות החברה עשויים לשתף עם החברה באופן פומבי כל פרט או פיסת מידע אותם יבחרו, על פי בחירת אותו הלקוח ובאחריותו הבלעדית לוודא כי הוא עומד בתנאי השימוש של האתר, כי הוא מוסמך ורשאי לשתף את המידע כאמור וכי אותו מידע אינו פוגעני ואינו כולל מידע אישי אודות אחר. מטבע הדברים, פרסום פומבי כאמור והמידע האישי הכלול בו, ככל שכלול בו, לא יוגן ויאובטח על פי מדיניות פרטיות זו והינו באחריותו הבלעדי של הלקוח.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• פניות ציבור: לצורך טיפול בפניות הציבור וטיוב ושיפור האתר ו/או השירותים ועל מנת לאפשר לחברה לתת מענה ללקוחותיה, בעת פניית הלקוחות אלינו באמצעות טופס פנייה לציבור ו/או הדואר האלקטרוני ו/או בטופס בקשה מקוון, הלקוחות עשויים לספק לנו נתונים אישיים מסוימים כגון שם, פרטי התקשרות, תוכן הפנייה וכל פרט או פיסת מידע אחרים אותם יבחרו הלקוחות לשתף עמנו.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• רישום לרשימות דיוור: לצורך יצירת קשר שוטף עם לקוחות i24 News, וכן כדי לעדכן את לקוחות החברה אודות פעילויות החברה ועדכונים שונים בקשר לחברה, באם הלקוחות יבחרו בכך, בעת הרישום לרשימות הדיוור הלקוחות עשויים לספק לחברה נתונים אישיים מסוימים כגון שם, דואר אלקטרוני ופרטי התקשרות, והעדפות אותו לקוח בקשר לקבלת הדיוור וסוגי הדיוור אותם מבקש אותו הלקוח לקבל. להשלמת ההוראות החלות על דיוור ישיר כאמור, ראה להלן \\\"דיוור ישיר אלקטרוני\\\".\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• השתתפות בסקרים: בעת מענה על שאלון ו/או סקר ו/או משוב את/ה עשוי/ה לספק לנו נתונים אישיים מסוימים אודותיך כמפורט בשאלון ו/או בסקר ו/או המשוב הרלוונטי. מידע זה נאסף לצרכי מחקר ו/או שיווק ו/או פרסום, ועל פי הסכמת הלקוח בלבד גם לצורך העברת המידע לגורמים אחרים וצדדים שלישיים לצרכים מסחריים.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• מידע הנאסף אוטומטית בגלישה באתר ו/או בצפייה בתכני האתר: לצורך שיפור חוויות הגלישה והשירותים המוצעים באתר, האתר עשוי, באופן אוטומטי, לאסוף ולאגור את המידע הבא: כתובת ה IP ושם השרת ממנה התחבר המשתמש לאתר ולאינטרנט; סוג הדפדפן ומערכת ההפעלה ששימשו להתחברות לאתר; התאריך והשעה בה התחבר המשתמש לאתר; מידע אודות השימוש באתר ו/או צפייה בתכני האתר, כגון העמודים, התיקיות, התכנים, המסמכים והקישורים בהם ביקר המשתמש דרך האתר, אופן השימוש, היקף השימוש, דפוס השימוש, משך השימוש; כתובת אתר האינטרנט ממנו קושר המשמש לאתר החברה.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• עוגיות (Cookies): האתר משתמש בקבצי עוגיות (Cookies) (להלן: \\\"עוגיות\\\"). קבצי עוגיות הינם קבצים הנשלחים אל המחשב שלך בעת ביקור באתר מסוים. עוגיות משמשות לאיתור דפוס שימוש, מאפייני סחר (traffic trends) והתנהגות צרכנית, כמו גם להקלטת מידע אחר מאתר האינטרנט. בעת ביקור חוזר באתר, קבצי עוגיות מאפשרים לאתר לזהות את הדפדפן שלך כך שלא תצטרך/כי להזין אותו מחדש בפעם הבאה בה תבקר/י באתר. קבצי עוגיות עשויים להכיל מידע בדבר העדפות משתמש, פעילות שביצעת באתר ופרטי מידע אחרים. האתר משתמש בקבצי עוגיות לצורך תפעולו השוטף והתקין, ובכלל זה כדי לאמת פרטים, לאסוף נתונים סטטיסטיים אודות השימוש באתר לשיפור חווית המשתמש ולצרכי אבטחת מידע, וכן על מנת להנגיש פרסומות המותאמות להעדפותיך. מידע הנאסף מהעוגיות לא ישמש ליצירת פרופילים וייעשה בו שימוש רק בצורה כוללנית (aggregate form). בכניסה הראשונה לאתר, יופיע סרגל עוגיות, בו באפשרות הלקוחות לבחור אם לאפשר או שלא לאפשר איסוף עוגיות ואת סוגי העוגיות שייאספו, כאשר באפשרות הלקוח לשנות את בחירתו בכל עת. תוכל/י לתכנת את הדפדפן שלך למניעת קבלת עוגיות מהאתר ו/או למחוק את קבצי העוגיות שנשמרו על ידי שינוי ההגדרות בדפדפן. אם תבחר/י לעשות כן, עדיין תהיה לך גישה למרבית השירותים באתר, אך יתכן שלא תוכל/י לקבל חלק מהשירותים המוצעים באתר החברה ו/או לבצע סוג מסוים של עסקאות (כמו רכישות) או ליהנות מחלק מהמרכיבים האינטראקטיביים המוצעים באתר. את פירוט סוגי העוגיות הנאספות באופן אוטומטי על ידי האתר ומידע נוסף בדבר איסוף קבצי עוגיות כאמור, ניתן למצוא בקישור https://www.i24news.tv/en/cookie-list.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• גוגל אנליטיקס (Google Analytics): אתר זה משתמש בגוגל אנליטיקס, מוצר של חברת Google שעוזר לחברה להבין את אופן המעורבות של לקוחות באתרים שלהם. בעת ביקור באתר, הדפדפן שולח באופן אוטומטי נתונים מסוימים לגוגל באמצעות קבצי עוגיות (ראו לעיל). נתונים אלה כוללים, בין היתר, את כתובת האינטרנט של הדף שבו אתם מבקרים ואת כתובת ה-IP. האינפורמציה שנאספת מועברת ונשמרת בשרתי Google והיא משתמשת במידע זה כדי להעריך את השימוש באתר, לצורך עריכת דוחות על פעילות האתר ועל השימוש באינטרנט בשביל מנהלי אתרים. Google עשויה גם להעביר את המידע לצד שלישי, כאשר היא נדרשת לכך מתוקף חוק, או כאשר צד שלישי מעבד את המידע עבורה. גלישה באתר זה מהווה את הסכמתך לאיסוף המידע על ידי Google באופן ולמען השימושים שצוינו לעיל.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eלמידע נוסף על אופן ביטול שליחת מידע ל- Google Analytics לחצו כאן. ולהרחבה בנושא Google Analytics לחצו כאן.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e• מטה פיקסל (Meta Pixel): האתר עושה שימוש במטה פיקסל של חברת Meta, המספקת שירות המשולב באתר המאפשר לחברה לנתח ולהבין את פעולות לקוחותיה של החברה באתר על מנת שתוכל החברה למדוד את יעילות הפרסום ולטייב את הפרסום המוצע באמצעות האתר דרך ספקי צד שלישי ללקוחות החברה.\u0026nbsp;\u003c/p\u003e\u003cp\u003e• – onetrust\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eדיוור ישיר אלקטרוני\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eלקוחות שיבחרו בכך, יוכלו להירשם לקבלת דיוור ישיר אלקטרוני מאת החברה, כך שמדי פעם, לפי שיקול דעת החברה, תשלח החברה ללקוחות דיוור ישיר באמצעות הצטרפות הלקוחות לקבוצת וואטסאפ (WhatsApp) מטעם החברה המנוהלת על ידי בוטים אלקטרוניים אשר באמצעותה יישלחו ללקוחות המעוניינים בכך הודעות דיוור ישיר אלקטרוני בעניין כתבות חדשות ועדכונים שונים, תוכן דיגיטלי, פרסומות והצעות לשיתוף פעולה, מבצעים, הטבות, ועדכונים שונים הקשורים לחברה ולפעילותה, ואשר לדעת החברה עשויים לעניין את קהל לקוחותיה.\u0026nbsp;\u003c/p\u003e\u003cp\u003eהודעות דיוור כאמור ישוגרו אל הלקוחות המעוניינים בכך בלבד ולאחר שנתנו את הסכמתם לכך ו/או בהתאם להוראות הדין. לקוחות שנרשמו לשירותי הדיוור הישיר יוכלו בכל עת לבטל את הסכמתם ולחדול מקבלת דיוור ישיר מהחברה, וזאת באמצעות קישור מיוחד להסרה מרשימת התפוצה שיופיע בתחתית כל הודעת דיוור אם מדובר בדואר אלקטרוני, או באמצעות יציאה יזומה של הלקוח מקבוצת הוואטסאפ של החברה ומחיקתה ממכשירו, או באמצעות פנייה בדואר אלקטרוני למנהל האתר לפי פרטי הקשר המופיעים בסוף מדיניות זו (להודעות הדיוור או בקבוצת הוואטסאפ לא ניתן להשיב, ולכן אין לבקש הסרה מרשימת הדיוור באמצעות השבה להודעת הדיוור).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eבעת השימוש באתר באמצעות אפליקציה שהורדת אל מכשיר הקצה שברשותך, האפליקציה עשויה לבקש לשלוח אליך הודעות מתפרצות (Push Notifications) בכל עת באפשרותך לבטל קבלת הודעות מתפרצות כאמור מאת האפליקציה באמצעות מכשירך או באפליקציה עצמה. למען הסר ספק, לחברה אין כל שליטה על הודעות מתפרצות כאמור והפסקתן – אלא באמצעות שינוי הגדרות האפליקציה ו/או המכשיר על ידי הלקוח.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eשמירת הפרטיות של ילדים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה דואגת להגנה על הפרטיות של ילדים מתחת לגיל 18 (\\\"ילדים\\\") והיא נוקטת משנה זהירות בכל הקשור לשמירת הפרטיות של ילדים וההגנה על המידע האישי שלהם. החברה אינה אוספת ביודעין מידע אישי הנוגע לילדים ולכן ילדים המשתמשים באתר ו/או מקבלים שירות מטעם החברה ו/או משתמשים בפלטפורמות שונות שהחברה עשויה לספק, מתבקשים שלא לשתף מידע אישי אודותיהם, וככל שילדים בכל זאת מרצונם החופשי ובידיעת ההשלכות הכרוכות בכך, מעוניינים לשתף מידע, עליהם לקבל את אישור הוריהם או האפוטרופוס שלהם (\\\"מבוגר\\\") בטרם ישלחו ו/או ישתפו כל מידע אישי. ככל שלחברה יהיה בסיס לסבור כי לא ניתנה הסכמת מבוגר כאמור, החברה תהיה רשאית לסרב לתת שירותים כלשהם, בהתאם לשיקול דעתה הבלעדי.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eהבסיס המשפטי לעיבוד המידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה תאסוף, תעבד ותשתף מידע אישי בכפוף להוראות הדין ורק אם יש בסיס חוקי לעשות כן, לרבות לצורך קיום חוזה (לדוגמא לצורך מתן שירות) ו/או קידום אינטרס לגיטימי של החברה ו/או לשם קיום חובה בדין.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eכאשר אין לחברה בסיס משפטי תקף אחר לאיסוף, עיבוד ו/או שיתוף מידע אישי, הפעולה תתבצע על פי הסכמת הלקוחות. לקוחות שמסרו את הסכמתם כאמור יוכלו להסיר את הסכמתם בכל עת באמצעות הודעה בדואר אלקטרוני. למען הסר ספק, הסרת הסכמה לא יגרע מזכות החברה להמשיך לעבד מידע שלקוח הסכים עליו לפני הסרת ההסכמה ו/או לעיבוד אחר אשר נעשה על בסיס משפטי אחר שאינו הסכמת הלקוחות.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eשמירת המידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהמידע האישי שנאסף יישמר במאגרי המידע של החברה המאוחסנים עבור החברה באמצעות ענן בשרתי Microsoft Azure, מחוץ לשטחי מדינת ישראל בהתאם לתקנות הגנת הפרטיות (העברת מידע אל מאגרי מידע שמחוץ לגבולות המדינה), התשס\\\"א-2001 וכן כל דין ובפרט בהתאם לדיני הגנת הפרטיות של מקום אחסון המידע.\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה תשמור את המידע האישי למשך הזמן הדרוש על מנת לממש את מטרות השימוש במידע המפורטות במדיניות זו או למשך פרק זמן ארוך יותר הנחוץ בהתאם לשיקול דעת החברה, והחברה תדאג לקיים בחינות תקופתיות על מנת לוודא שמידע אישי לא יישמר ויאוחסן אצל החברה מעבר לדרוש.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eשיתוף מידע עם צד שלישי\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה תשמור בסודיות את המידע האישי, ולא תעשה בו שימוש מעבר למטרות השימוש שפורטו במדיניות זו לעיל, וכן לא תעבירו לצד שלישי כלשהו, למעט במקרים המפורטים להלן:\u0026nbsp;\u003c/p\u003e\u003cp\u003e1. לקבוצת החברות של i24News, לרבות חברת האם, חברות אחיות, חברות בנות; וכן, לעובדי קבוצת החברות, ככל שחשיפת העובדים למידע נדרשת למטרות המוגדרות במדיניות פרטיות זו;\u003c/p\u003e\u003cp\u003e2. לצורך מתן השירותים ללקוחות באמצעות ו/או בסיוע של צדדים שלישיים (לדוגמא כאשר השירות ניתן על ידי ספק חיצוני ו/או תלוי בספק חיצוני); במקרה כאמור, בו יועבר המידע האישי שלך לצדדים שלישיים כאמור, נבקש מאותם גורמים להתחייב לשמור על סודיות המידע ולהשתמש בו רק למטרה לשמה נמסר להם אותו מידע אישי והם יהיו מחויבים כלפיך על פי מדיניות פרטיות זו;\u003c/p\u003e\u003cp\u003e3. לצורך ציות לדרישות החוק ו/או הרגולציה ו/או אם יתקבלו צו שיפוטי ו/או החלטה מנהלית מרשות מנהלית מוסמכת, המורים לחברה למסור מידע אישי לצד שלישי כלשהו;\u0026nbsp;\u003c/p\u003e\u003cp\u003e4. למימוש האינטרסים הלגיטימיים של החברה, לרבות במקרה של מחלוקת משפטית בין החברה ללקוח נשוא המידע האישי שתחייב את חשיפת המידע האישי ביחס לאותו לקוח;\u003c/p\u003e\u003cp\u003e5. לצרכי מסחור המידע ומכירתו לאחר, בהתאם להוראות מדיניות פרטיות זו, ובלבד שנתקבלה הסכמה מפורשת לפעולה כאמור מאת לקוחותינו נושאי המידע, אותה הם יוכלו להסיר בכל עת ועל פי שיקול דעתם.\u003c/p\u003e\u003cp\u003eאין באמור בכדי לגרוע מאפשרות הלקוח לשתף מידע אישי ישירות עם צדדים שלישיים באמצעות האתר ו/או הפלטפורמות השונות אותן מציעה החברה, ובפרט עם ספקי צד שלישי, לרבות ומבלי לפגוע בכלליות האמור לעיל, לצורך ביצוע תשלומים לקבלת חלק משירותי החברה באמצעות ספקי צד שלישי כאמור.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eאבטחה\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה נוקטת במיטב האמצעים הטכנולוגיים והארגוניים הנדרשים על מנת להבטיח הגנה ברמה גבוהה על המידע האישי שברשותה. בנוסף, בכל מקום בו החברה מעבירה או משתפת מידע אישי, בהתאם למדיניות פרטיות זו, החברה מחייבת גם את אותם צדדים שלישיים לנקוט באמצעים הטכנולוגיים והארגוניים הדרושים על מנת שרמת ההגנה על המידע האישי המועבר או משותף כאמור לא תפחת מרמת ההגנה בחברה, וכי אבטחת המידע והשימוש בו ייעשו על פי הוראות הדין ולפי מדיניות פרטיות זו לכל הפחות.\u003c/p\u003e\u003cp\u003eלצד האמור לעיל, מטבע הדברים, העברת מידע באמצעות האינטרנט נלווית סיכונים מסוימים ואינה בטוחה לחלוטין. בהתאם לכך, אין בידי החברה בכדי להתחייב ולהבטיח שכל שירותיה יהיו חסינים באופן מוחלט מפני גישה בלתי-מורשית למידע המאוחסן באתר ו/או בשרתים. החברה תישא אך ורק ובאופן בלעדי באחריות המוטלת עליה על פי כל דין.\u0026nbsp;\u003c/p\u003e\u003cp\u003eהחברה תנקוט במאמצים הראויים על מנת לשמור על פרטיות המידע וחסימת גישה בלתי-מורשית למידע, ובכל מקרה תקיים את דרישות הדין גם במקרה של פרצת אבטחה של מידע אישי, ובין היתר, החברה תודיע ללקוחות על פרצת אבטחה כאמור, ככל שהודעה כאמור נדרשת על פי דין.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eקישורים לאתרים של צדדים שלישיים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eבאתר האינטרנט של החברה ו/או בפרסומים אחרים מטעמה עשויים להימצא קישורים להודעות ו/או פרסומות ו/או אתרים ו/או מקורות של צדדים שלישיים, שאינם קשורים לחברה ו/או מי מטעמה. בין היתר, מוטמעים באתר החברה פרסומות ו/או אתרים העשויים לעניין את לקוחות החברה על פי העדפותיהם באמצעות שירותי צד שלישי על ידי Taboola. באתר החברה הפניה לרשתות חברתיות מסוימות כגון ;Facebook Twitter; LinkedIn; Discord; ו-WhatsApp. כמו כן, התשלום בעבור חלק משירותי החברה יבוצע באמצעות ספקי צד שלישי, Apple ו-Google, כאשר הלקוחות יופנו לשירותיהם לצורך ביצוע התשלום.\u003c/p\u003e\u003cp\u003eכניסת הלקוחות לקישורים חיצוניים באתר נתונה לשיקול דעתם בלבד. החברה אינה אחראית ואין לה שום שליטה למנגנוני השמירה על הפרטיות ו/או על הנעשה במידע הנאסף באותם האתרים ו/או לתוכן של אותם אתרים, וקישורים אלו לא נועדו להוות אישור על ידי החברה של אותם אתרים ו/או של תוכנם ו/או של מדיניות הפרטיות שלהם. החברה אינה מקבלת על עצמה שום אחריות כלשהי לגבי נהלי איסוף הנתונים, השימוש בהם, שיתופם עם צדדים שלישיים או על כל פעולה אחרת הנעשית ביחס למידע הנאסף במסגרת הקישורים החיצוניים.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eבעת לחיצה על קישור כאמור, הלקוחות יופנו מאתר האינטרנט של החברה לאתר צד שלישי, ובעת עזיבת האתר לאתר צד שלישי, תחול על הגלישה באתר צד שלישי מדיניות הפרטיות והתקנון של אותו אתר אליו הופנו הלקוחות, ואילו הלקוחות לא יהיו מוגנים תחת מדיניות פרטיות זו בעת גלישה באתר צד שלישי, ולכן החברה ממליצה ללקוחות המופנים לאתר צד שלישי כאמור לקרוא את תנאי השימוש ומדיניות הפרטיות של אותו אתר צד שלישי בעיון בטרם הגלישה.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eזכויות הלקוחות ביחס למידע האישי\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eעל-פי חוק הגנת הפרטיות, התשמ\\\"א - 1981, כל אדם זכאי לעיין במידע המוחזק עליו במאגר מידע. אדם שעיין במידע שעליו ומצא כי אינו נכון, שלם, ברור או מעודכן, רשאי לפנות לבעל מאגר המידע בבקשה לתקן את המידע או למחיקתו. בנוסף, אם המידע שבמאגרי החברה משמש לצורך פניה אישית אל אדם, אותו אדם זכאי על-פי חוק הגנת הפרטיות, התשמ\\\"א- 1981 לדרוש בכתב שהמידע המתייחס אליו יימחק ממאגר המידע.\u003c/p\u003e\u003cp\u003eבמקרים בהם לצד הדין הישראלי, חלות על הלקוחות הוראות דין זר כלשהו, לרבות ומבלי לפגוע בכלליות האמור - הדין האירופי ובכלל זה ה-General Data Protection Regulation (GDPR) ו/אוCalifornia Consumer Privacy Act (CCPA) ו/או כל דין זר אחר, אותם לקוחות יהיו זכאים לכל הזכויות מכוח הדין הזר החל עליהם, וזאת כמובן לצד זכויות הדין הישראלי המגן על פרטיותם, וביניהן: הזכות לקבל מידע, זכות הגישה למידע, הזכות לתיקון המידע ומחיקתו, הזכות להגביל את עיבוד המידע, הזכות לניוד המידע, הזכות להתנגד הזכות להימנעות מקבלת החלטות אוטומטיות וכיוצא באלה.\u0026nbsp;\u003c/p\u003e\u003cp\u003eלקוחות המעוניינים לפנות לחברה אודות המידע שמוחזק עליהם על ידי החברה, או לבקש שהמידע יתוקן או יימחק, מתבקשים להפנות את הבקשה בכתב תוך פירוט תוכן בקשתם, וזאת בהתאם לפרטי ההתקשרות עם החברה המופיעים להלן.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eשינויים במדיניות הפרטיות\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eמדיניות פרטיות זו עשויה להשתנות מעת לעת וכפופה לרגולציה וחקיקה המשתנות מדי פעם.\u0026nbsp;\u003c/p\u003e\u003cp\u003eבשל כך, החברה ממליצה ללקוחות לקרוא בעיון את מדיניות הפרטיות כפי שתפורסם באתר בכל עת שישותף עם החברה מידע ו/או בכל כניסה חדשה לאתר. כל אימת שלקוח נרשם לשירות ו/או משתמש בפועל בשירותים אותם החברה מספקת הדבר ייחשב להסכמה למדיניות פרטיות זו לרבות לכל השינויים הכלולים בה ככל שישנם.\u003c/p\u003e\u003cp\u003eבמקרה בו יבוצעו במדיניות זו שינויים מהותיים בהוראות שעניינן השימוש במידע אישי, החברה תנקוט במאמצים הראויים ליידע את הלקוחות באמצעות ערוצי התקשורת המקובלים בנסיבות העניין, ולרבות באמצעות עדכון מדיניות פרטיות זו ופרסום הודעת עדכון באתר, וכאשר הדבר נדרש על פי דין – החברה תפנה אל הלקוחות לקבל את הסכמתם לשינויים מהותיים כאמור. אלא אם נאמר אחרת, כל השינויים ייכנסו לתוקפם ביום הפרסום שלהם באתר. פרטים בקשר לעדכון האחרון של כל גרסה, יופיעו בתחתית המסמך.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eדין וסמכות שיפוט\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eסמכות השיפוט הבלעדית תהא נתונה לבית המשפט המוסמך במחוז ירושלים, בישראל. הדין החל על כל מחלוקת בעניין האתר ו/או מדינות הפרטיות זו הנו הדין הישראלי בלבד באופן בלעדי ומוחלט וללא כללי ברירת הדין.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eצור קשר\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eלקוחות המעוניינים ליצור קשר עם החברה בכל נושא הקשור להגנת המידע האישי או הגנת הפרטיות, ניתן לפנות אל הממונה על הגנת הפרטיות של החברה באמצעות בדרכי ההתקשרות שלהלן.\u003c/p\u003e\u003cp\u003eהממונה על הגנת הפרטיות בחברה:\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eדוא\\\"ל: dpo@i24news.tv\u0026nbsp;\u003c/p\u003e\u003cp\u003eכתובת: האנגר 1 נמל יפו בתל אביב-יפו\u003c/p\u003e\u003cp\u003eעודכן לאחרונה בתאריך: 26/06/2024.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003ePolitique de confidentialité\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePolitique de protection des données personnelles – i24NEWS\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIntroduction\u003c/p\u003e\u003cp\u003eLa présente Politique de protection des données personnelles fait partie intégrante des Conditions d’utilisation applicables au site internet, aux applications et aux plateformes numériques de I24NEWS. Elle a pour objectif d’expliquer de manière claire, complète et détaillée la manière dont les données personnelles des visiteurs et utilisateurs des services numériques de I24NEWS sont collectées, utilisées, conservées, traitées, partagées et protégées.\u003c/p\u003e\u003cp\u003eLe site internet, les applications et les services numériques de I24NEWS sont exploités et administrés par MIDDLE EAST NEWS – I24 Ltd, société régie par les lois de l’État d’Israël.\u003c/p\u003e\u003cp\u003eAdresse enregistrée :\u003c/p\u003e\u003cp\u003eHangar 1, Jaffa Port\u003c/p\u003e\u003cp\u003eTel Aviv-Jaffa\u003c/p\u003e\u003cp\u003eISRAEL\u003c/p\u003e\u003cp\u003eContact général :\u003c/p\u003e\u003cp\u003econtact@i24news.tv\u003c/p\u003e\u003cp\u003eContact relatif à la protection des données et à la vie privée :\u003c/p\u003e\u003cp\u003edpo@i24news.tv\u003c/p\u003e\u003cp\u003eMIDDLE EAST NEWS – I24 Ltd s’engage à protéger la vie privée des utilisateurs et à traiter leurs données personnelles conformément aux lois israéliennes applicables, y compris la Privacy Protection Law, 1981, ainsi qu’à toute réglementation, modification ou instruction pertinente émise par les autorités compétentes de l’État d’Israël.\u003c/p\u003e\u003cp\u003eLa présente Politique ne s’applique pas aux sites internet, applications ou services de tiers qui ne sont pas détenus, exploités ou contrôlés par MIDDLE EAST NEWS – I24 Ltd.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e1. Définitions\u003c/p\u003e\u003cp\u003eAux fins de la présente Politique, les termes suivants auront la signification indiquée ci-dessous :\u003c/p\u003e\u003cp\u003e« Société », « nous » ou « notre » désignent MIDDLE EAST NEWS – I24 Ltd, exploitant du site, des applications et des services de I24NEWS.\u003c/p\u003e\u003cp\u003e« Site » désigne le site I24NEWS, accessible notamment aux adresses suivantes, ainsi qu’à toute autre adresse pouvant être ajoutée ou remplacée ultérieurement :\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv/ar\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv/en\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv/fr\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv/he\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e« Application » désigne les applications I24NEWS disponibles via les boutiques d’applications, notamment App Store et Google Play.\u003c/p\u003e\u003cp\u003e« Services » désigne l’ensemble des services numériques et médias proposés par MIDDLE EAST NEWS – I24 Ltd, notamment les articles, vidéos, diffusions en direct, rediffusions, comptes personnels, newsletters, notifications, commentaires, abonnements et services associés.\u003c/p\u003e\u003cp\u003e« Utilisateur » désigne toute personne qui accède au Site ou à l’Application, ou qui utilise l’un quelconque des Services.\u003c/p\u003e\u003cp\u003e« Données personnelles » désigne toute information se rapportant à une personne physique identifiée ou identifiable, directement ou indirectement.\u003c/p\u003e\u003cp\u003e« Traitement » désigne toute opération effectuée sur des Données personnelles, y compris la collecte, l’enregistrement, le stockage, l’organisation, l’utilisation, la transmission, la mise à disposition, la modification, la suppression ou la destruction.\u003c/p\u003e\u003cp\u003e« Cookies » désigne les fichiers ou technologies stockés sur l’appareil de l’Utilisateur lors de sa visite du Site ou de l’utilisation de l’Application, et inclut également les outils de suivi, balises, tags, pixels, local storage, session storage et moyens similaires de mesure et d’analyse.\u003c/p\u003e\u003cp\u003e« Prestataires de services » désigne les tiers qui assistent MIDDLE EAST NEWS – I24 Ltd dans l’exploitation du Site, de l’Application et des Services, notamment les prestataires d’hébergement, de paiement, d’analyse, de publicité, de cybersécurité, d’envoi d’e-mails et de services applicatifs.\u003c/p\u003e\u003cp\u003e« Archivage actif » désigne la conservation des données dans une base utilisée pour fournir les services en cours à l’Utilisateur.\u003c/p\u003e\u003cp\u003e« Archivage intermédiaire » désigne la conservation de données qui ne sont plus utilisées quotidiennement, mais qui peuvent rester nécessaires à des fins juridiques, administratives, comptables, de sécurité ou de gestion de litiges.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e2. Acceptation de la Politique et base juridique du traitement\u003c/p\u003e\u003cp\u003eEn accédant au Site ou à l’Application, ou en utilisant l’un des Services de I24NEWS, l’Utilisateur reconnaît avoir pris connaissance de la présente Politique et l’avoir comprise.\u003c/p\u003e\u003cp\u003eLe traitement des Données personnelles par MIDDLE EAST NEWS – I24 Ltd repose sur une ou plusieurs des bases juridiques suivantes :\u003c/p\u003e\u003cp\u003e• l’exécution de la relation contractuelle entre l’Utilisateur et la Société, y compris les Conditions d’utilisation ;\u003c/p\u003e\u003cp\u003e• le consentement de l’Utilisateur, notamment en ce qui concerne les Cookies non essentiels, les communications marketing ou certains outils de suivi ;\u003c/p\u003e\u003cp\u003e• les intérêts légitimes de la Société, tels que l’amélioration des services, la protection du Site, la prévention de la fraude, la mesure de performance et la gestion des contenus ;\u003c/p\u003e\u003cp\u003e• les obligations légales ou réglementaires pouvant s’appliquer à la Société ;\u003c/p\u003e\u003cp\u003e• la protection des droits de la Société, des Utilisateurs ou de tiers lorsque cela est nécessaire.\u003c/p\u003e\u003cp\u003eSi l’Utilisateur est mineur, l’utilisation du Site ou de l’Application doit se faire sous la supervision d’un parent ou d’un tuteur légal, lequel demeure responsable de l’utilisation des Services par le mineur.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e3. Données collectées par la Société\u003c/p\u003e\u003cp\u003eMIDDLE EAST NEWS – I24 Ltd peut collecter et traiter différentes catégories de données, selon la manière dont l’Utilisateur utilise le Site, l’Application ou les Services.\u003c/p\u003e\u003cp\u003e3.1 Données d’identification et de compte\u003c/p\u003e\u003cp\u003eLors de la création d’un compte personnel ou de l’utilisation de certains Services, nous pouvons collecter les données suivantes :\u003c/p\u003e\u003cp\u003e• nom et prénom ;\u003c/p\u003e\u003cp\u003e• pseudonyme ;\u003c/p\u003e\u003cp\u003e• adresse e-mail ;\u003c/p\u003e\u003cp\u003e• langue préférée ;\u003c/p\u003e\u003cp\u003e• pays ou lieu de résidence général ;\u003c/p\u003e\u003cp\u003e• données de connexion ;\u003c/p\u003e\u003cp\u003e• mot de passe sous forme chiffrée ;\u003c/p\u003e\u003cp\u003e• préférences de l’Utilisateur ;\u003c/p\u003e\u003cp\u003e• abonnements aux newsletters ou aux notifications.\u003c/p\u003e\u003cp\u003eL’Utilisateur s’engage à fournir des données exactes, sincères et à jour, et il est responsable de leur mise à jour en cas de changement.\u003c/p\u003e\u003cp\u003e3.2 Données de connexion et d’utilisation technique\u003c/p\u003e\u003cp\u003eDes données techniques peuvent être collectées automatiquement lors de l’utilisation du Site ou de l’Application, notamment :\u003c/p\u003e\u003cp\u003e• adresse IP ;\u003c/p\u003e\u003cp\u003e• type d’appareil utilisé ;\u003c/p\u003e\u003cp\u003e• système d’exploitation ;\u003c/p\u003e\u003cp\u003e• type et version du navigateur ;\u003c/p\u003e\u003cp\u003e• fournisseur d’accès à Internet ;\u003c/p\u003e\u003cp\u003e• date et heure de la visite ;\u003c/p\u003e\u003cp\u003e• pages consultées ;\u003c/p\u003e\u003cp\u003e• liens cliqués ;\u003c/p\u003e\u003cp\u003e• durée de la session ;\u003c/p\u003e\u003cp\u003e• données de performance et d’erreur ;\u003c/p\u003e\u003cp\u003e• identifiants de l’appareil ou de l’application ;\u003c/p\u003e\u003cp\u003e• paramètres de langue ;\u003c/p\u003e\u003cp\u003e• localisation géographique approximative, lorsque disponible ou autorisée.\u003c/p\u003e\u003cp\u003e3.3 Données d’interaction et de contenu\u003c/p\u003e\u003cp\u003eLa Société peut traiter des données relatives à l’interaction de l’Utilisateur avec les Services, notamment :\u003c/p\u003e\u003cp\u003e• commentaires publiés sur le Site ou dans l’Application ;\u003c/p\u003e\u003cp\u003e• articles consultés ou sauvegardés ;\u003c/p\u003e\u003cp\u003e• vidéos visionnées ;\u003c/p\u003e\u003cp\u003e• inscription ou désinscription aux newsletters ;\u003c/p\u003e\u003cp\u003e• interaction avec les notifications ou messages ;\u003c/p\u003e\u003cp\u003e• messages ou demandes envoyés via les formulaires de contact ;\u003c/p\u003e\u003cp\u003e• signalements relatifs à des contenus illicites ou demandes de droit de réponse.\u003c/p\u003e\u003cp\u003e3.4 Données de paiement et d’abonnement\u003c/p\u003e\u003cp\u003eSi certains Services sont payants, les paiements peuvent être traités par des prestataires externes, notamment :\u003c/p\u003e\u003cp\u003ehttps://cleeng.com/legal\u003c/p\u003e\u003cp\u003ehttps://www.apple.com/legal/privacy/\u003c/p\u003e\u003cp\u003ehttps://play.google.com/store/apps/details?id=com.onetrust.gdpr\u0026amp;hl=en\u003c/p\u003e\u003cp\u003eLa Société confirme qu’elle ne stocke pas, en règle générale, les données complètes de carte bancaire ni les mots de passe de paiement. Ces données sont traitées par les prestataires de paiement ou les boutiques d’applications conformément à leurs propres politiques et conditions.\u003c/p\u003e\u003cp\u003eLa Société peut conserver certaines données relatives à l’abonnement, à la facture ou au statut de paiement, dans la mesure nécessaire à la gestion du service et au respect des obligations légales et comptables.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e4. Cookies et technologies de suivi\u003c/p\u003e\u003cp\u003eMIDDLE EAST NEWS – I24 Ltd utilise des Cookies et technologies similaires afin d’exploiter le Site et l’Application, d’améliorer l’expérience utilisateur, d’analyser les performances et de personnaliser les contenus et publicités.\u003c/p\u003e\u003cp\u003eLes Cookies peuvent notamment inclure les catégories suivantes :\u003c/p\u003e\u003cp\u003e4.1 Cookies nécessaires\u003c/p\u003e\u003cp\u003eCes Cookies sont indispensables au fonctionnement du Site et de l’Application, par exemple pour :\u003c/p\u003e\u003cp\u003e• maintenir la session ;\u003c/p\u003e\u003cp\u003e• permettre la connexion ;\u003c/p\u003e\u003cp\u003e• protéger contre l’utilisation illicite ;\u003c/p\u003e\u003cp\u003e• mémoriser certains paramètres essentiels ;\u003c/p\u003e\u003cp\u003e• permettre l’accès au compte personnel.\u003c/p\u003e\u003cp\u003e4.2 Cookies d’analyse et de mesure\u003c/p\u003e\u003cp\u003eCes Cookies aident la Société à comprendre la manière dont le Site et l’Application sont utilisés, notamment :\u003c/p\u003e\u003cp\u003e• nombre de visites ;\u003c/p\u003e\u003cp\u003e• pages les plus consultées ;\u003c/p\u003e\u003cp\u003e• durée de navigation ;\u003c/p\u003e\u003cp\u003e• performance vidéo ;\u003c/p\u003e\u003cp\u003e• erreurs techniques ;\u003c/p\u003e\u003cp\u003e• amélioration de l’expérience utilisateur.\u003c/p\u003e\u003cp\u003e4.3 Cookies de personnalisation\u003c/p\u003e\u003cp\u003eCes Cookies servent à personnaliser l’expérience de l’Utilisateur, notamment :\u003c/p\u003e\u003cp\u003e• langue préférée ;\u003c/p\u003e\u003cp\u003e• paramètres d’affichage ;\u003c/p\u003e\u003cp\u003e• préférences de contenu ;\u003c/p\u003e\u003cp\u003e• mémorisation de formulaires précédemment remplis.\u003c/p\u003e\u003cp\u003e4.4 Cookies publicitaires et commerciaux\u003c/p\u003e\u003cp\u003eLa Société ou ses partenaires peuvent utiliser des Cookies afin d’afficher des publicités ou contenus commerciaux plus adaptés à l’Utilisateur, ainsi que pour mesurer la performance des campagnes publicitaires.\u003c/p\u003e\u003cp\u003eL’Utilisateur peut gérer ses préférences relatives aux Cookies via les paramètres de son navigateur ou, lorsqu’un tel outil est disponible, via l’outil de gestion des préférences proposé sur le Site ou dans l’Application.\u003c/p\u003e\u003cp\u003eLa désactivation de certains Cookies peut limiter certaines fonctionnalités du Site ou de l’Application.\u003c/p\u003e\u003cp\u003eLa durée de conservation des Cookies ne dépasse généralement pas 13 mois, sauf lorsque la loi ou la nature du service exige une autre durée.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e5. Finalités du traitement des données\u003c/p\u003e\u003cp\u003eLa Société traite les Données personnelles aux fins suivantes :\u003c/p\u003e\u003cp\u003e• exploiter le Site, l’Application et les services numériques ;\u003c/p\u003e\u003cp\u003e• créer et gérer les comptes personnels ;\u003c/p\u003e\u003cp\u003e• permettre à l’Utilisateur de commenter ou d’interagir avec les contenus ;\u003c/p\u003e\u003cp\u003e• envoyer des newsletters ou notifications, lorsque l’Utilisateur y a consenti ou les a demandées ;\u003c/p\u003e\u003cp\u003e• gérer les abonnements et services payants ;\u003c/p\u003e\u003cp\u003e• améliorer l’expérience utilisateur ;\u003c/p\u003e\u003cp\u003e• analyser l’utilisation du Site et de l’Application ;\u003c/p\u003e\u003cp\u003e• mesurer la performance des contenus, vidéos et services ;\u003c/p\u003e\u003cp\u003e• personnaliser les contenus ou publicités ;\u003c/p\u003e\u003cp\u003e• protéger le Site et l’Application contre la fraude, les attaques ou l’utilisation illicite ;\u003c/p\u003e\u003cp\u003e• gérer les signalements, réclamations et demandes de droit de réponse ;\u003c/p\u003e\u003cp\u003e• respecter les obligations légales ou réglementaires ;\u003c/p\u003e\u003cp\u003e• protéger les droits et intérêts de la Société, des Utilisateurs ou de tiers.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e6. Newsletters et communications marketing\u003c/p\u003e\u003cp\u003eLa Société peut envoyer aux Utilisateurs des e-mails, mises à jour, newsletters ou communications relatives aux Services, aux nouveaux contenus, aux offres ou aux partenaires, lorsque cela est autorisé par la loi ou fondé sur le consentement de l’Utilisateur.\u003c/p\u003e\u003cp\u003eL’Utilisateur peut à tout moment se désinscrire par l’un des moyens suivants :\u003c/p\u003e\u003cp\u003e• lien de désinscription figurant dans les messages ;\u003c/p\u003e\u003cp\u003e• paramètres du compte personnel, lorsqu’ils sont disponibles ;\u003c/p\u003e\u003cp\u003e• demande envoyée à : dpo@i24news.tv\u003c/p\u003e\u003cp\u003eLa Société peut continuer à envoyer des communications non marketing nécessaires, telles que les messages relatifs au compte, à la sécurité, aux mises à jour juridiques ou à la gestion de l’abonnement.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e7. Partage des données avec des tiers\u003c/p\u003e\u003cp\u003eLa Société peut partager des Données personnelles, uniquement dans la mesure nécessaire, avec les catégories  المستخدم.\u003c/p\u003e\u003cp\u003e• الاشتراكات في النشرات البريدية أو الإشعارات.\u003c/p\u003e\u003cp\u003eيلتزم المستخدم بتقديم بيانات دقيقة وصحيحة ومحدثة، ويكون مسؤولًا عن تحديثها عند حدوث أي تغيير.\u003c/p\u003e\u003cp\u003e3.2 بيانات الاتصال والاستخدام التقني\u003c/p\u003e\u003cp\u003eقد يتم جمع بيانات تقنية تلقائيًا عند استخدام الموقع أو التطبيق، بما في ذلك:\u003c/p\u003e\u003cp\u003e• عنوان IP.\u003c/p\u003e\u003cp\u003e• نوع الجهاز المستخدم.\u003c/p\u003e\u003cp\u003e• نظام التشغيل.\u003c/p\u003e\u003cp\u003e• نوع المتصفح وإصداره.\u003c/p\u003e\u003cp\u003e• مزود خدمة الإنترنت.\u003c/p\u003e\u003cp\u003e• تاريخ ووقت الزيارة.\u003c/p\u003e\u003cp\u003e• الصفحات التي تمت زيارتها.\u003c/p\u003e\u003cp\u003e• الروابط التي تم النقر عليها.\u003c/p\u003e\u003cp\u003e• مدة الجلسة.\u003c/p\u003e\u003cp\u003e• بيانات الأداء والأخطاء.\u003c/p\u003e\u003cp\u003e• معرّفات الجهاز أو التطبيق.\u003c/p\u003e\u003cp\u003e• إعدادات اللغة.\u003c/p\u003e\u003cp\u003e• الموقع الجغرافي التقريبي، إذا كان ذلك متاحًا أو مسموحًا به.\u003c/p\u003e\u003cp\u003e3.3 بيانات التفاعل والمحتوى\u003c/p\u003e\u003cp\u003eقد تعالج الشركة بيانات مرتبطة بتفاعل المستخدم مع الخدمات، مثل:\u003c/p\u003e\u003cp\u003e• التعليقات المنشورة على الموقع أو التطبيق.\u003c/p\u003e\u003cp\u003e• المقالات التي تمت قراءتها أو حفظها.\u003c/p\u003e\u003cp\u003e• مقاطع الفيديو التي تمت مشاهدتها.\u003c/p\u003e\u003cp\u003e• الاشتراك أو إلغاء الاشتراك في النشرات البريدية.\u003c/p\u003e\u003cp\u003e• التفاعل مع الإشعارات أو الرسائل.\u003c/p\u003e\u003cp\u003e• الرسائل أو الطلبات المرسلة عبر نماذج الاتصال.\u003c/p\u003e\u003cp\u003e• البلاغات المتعلقة بالمحتوى المخالف أو طلبات حق الرد.\u003c/p\u003e\u003cp\u003e3.4 بيانات الدفع والاشتراكات\u003c/p\u003e\u003cp\u003eإذا كانت بعض الخدمات خاضعة للدفع، فقد تتم معالجة عمليات الدفع عبر مزودي خدمات خارجيين مثل:\u003c/p\u003e\u003cp\u003ehttps://cleeng.com/legal\u003c/p\u003e\u003cp\u003ehttps://www.apple.com/legal/privacy/\u003c/p\u003e\u003cp\u003ehttps://play.google.com/store/apps/details?id=com.onetrust.gdpr\u0026amp;hl=en\u003c/p\u003e\u003cp\u003eتؤكد الشركة أنها لا تقوم، كقاعدة عامة، بتخزين بيانات بطاقة الدفع الكاملة أو كلمات مرور الدفع. تتم معالجة هذه البيانات من قبل مزودي الدفع أو متاجر التطبيقات وفقًا لسياساتهم وشروطهم الخاصة.\u003c/p\u003e\u003cp\u003eقد تحتفظ الشركة ببيانات مرتبطة بالاشتراك أو الفاتورة أو حالة الدفع، بالقدر اللازم لإدارة الخدمة والامتثال للالتزامات القانونية والمحاسبية.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e4. ملفات تعريف الارتباط وأدوات التتبع\u003c/p\u003e\u003cp\u003eتستخدم الشركة ملفات تعريف الارتباط وأدوات تتبع مشابهة بهدف تشغيل الموقع والتطبيق وتحسين تجربة المستخدم وتحليل الأداء وتخصيص المحتوى والإعلانات.\u003c/p\u003e\u003cp\u003eقد تشمل ملفات تعريف الارتباط ما يلي:\u003c/p\u003e\u003cp\u003e4.1 ملفات ضرورية\u003c/p\u003e\u003cp\u003eهذه الملفات ضرورية لتشغيل الموقع والتطبيق، مثل:\u003c/p\u003e\u003cp\u003e• حفظ الجلسة.\u003c/p\u003e\u003cp\u003e• تسجيل الدخول.\u003c/p\u003e\u003cp\u003e• الحماية من الاستخدام غير المشروع.\u003c/p\u003e\u003cp\u003e• تذكر إعدادات أساسية.\u003c/p\u003e\u003cp\u003e• تمكين الوصول إلى الحساب الشخصي.\u003c/p\u003e\u003cp\u003e4.2 ملفات تحليل وقياس\u003c/p\u003e\u003cp\u003eتساعد هذه الملفات الشركة على فهم طريقة استخدام الموقع والتطبيق، مثل:\u003c/p\u003e\u003cp\u003e• عدد الزيارات.\u003c/p\u003e\u003cp\u003e• الصفحات الأكثر قراءة.\u003c/p\u003e\u003cp\u003e• مدة التصفح.\u003c/p\u003e\u003cp\u003e• أداء الفيديو.\u003c/p\u003e\u003cp\u003e• الأخطاء التقنية.\u003c/p\u003e\u003cp\u003e• تحسين تجربة المستخدم.\u003c/p\u003e\u003cp\u003e4.3 ملفات تخصيص\u003c/p\u003e\u003cp\u003eتستخدم لتخصيص تجربة المستخدم، مثل:\u003c/p\u003e\u003cp\u003e• اللغة المفضلة.\u003c/p\u003e\u003cp\u003e• إعدادات العرض.\u003c/p\u003e\u003cp\u003e• تفضيلات المحتوى.\u003c/p\u003e\u003cp\u003e• تذكر نماذج تم تعبئتها سابقًا.\u003c/p\u003e\u003cp\u003e4.4 ملفات إعلانية وتجارية\u003c/p\u003e\u003cp\u003eقد تستخدم الشركة أو شركاؤها ملفات تعريف الارتباط لعرض إعلانات أو محتوى تجاري أكثر ملاءمة للمستخدم، وقياس أداء الحملات الإعلانية.\u003c/p\u003e\u003cp\u003eيمكن للمستخدم إدارة إعدادات ملفات تعريف الارتباط من خلال إعدادات المتصفح أو، حيثما توفر ذلك، من خلال أداة إدارة التفضيلات على الموقع أو التطبيق.\u003c/p\u003e\u003cp\u003eقد يؤدي تعطيل بعض ملفات تعريف الارتباط إلى الحد من بعض وظائف الموقع أو التطبيق.\u003c/p\u003e\u003cp\u003eمدة حفظ ملفات تعريف الارتباط لا تتجاوز عادة 13 شهرًا، ما لم يتطلب القانون أو طبيعة الخدمة مدة أخرى.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e5. أهداف معالجة البيانات\u003c/p\u003e\u003cp\u003eتقوم الشركة بمعالجة البيانات الشخصية للأغراض التالية:\u003c/p\u003e\u003cp\u003e• تشغيل الموقع والتطبيق والخدمات الرقمية.\u003c/p\u003e\u003cp\u003e• إنشاء وإدارة الحسابات الشخصية.\u003c/p\u003e\u003cp\u003e• تمكين المستخدم من التعليق أو التفاعل مع المحتوى.\u003c/p\u003e\u003cp\u003e• إرسال النشرات البريدية أو الإشعارات، إذا وافق المستخدم على ذلك أو طلبه.\u003c/p\u003e\u003cp\u003e• إدارة الاشتراكات والخدمات المدفوعة.\u003c/p\u003e\u003cp\u003e• تحسين تجربة المستخدم.\u003c/p\u003e\u003cp\u003e• تحليل استخدام الموقع والتطبيق.\u003c/p\u003e\u003cp\u003e• قياس أداء المحتوى والفيديو والخدمات.\u003c/p\u003e\u003cp\u003e• تخصيص المحتوى أو الإعلانات.\u003c/p\u003e\u003cp\u003e• حماية الموقع والتطبيق من الاحتيال أو الهجمات أو الاستخدام غير المشروع.\u003c/p\u003e\u003cp\u003e• إدارة البلاغات والشكاوى وطلبات حق الرد.\u003c/p\u003e\u003cp\u003e• الامتثال للالتزامات القانونية أو التنظيمية.\u003c/p\u003e\u003cp\u003e• حماية حقوق ومصالح الشركة أو المستخدمين أو أطراف ثالثة.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e6. النشرات البريدية والرسائل التسويقية\u003c/p\u003e\u003cp\u003eقد ترسل الشركة للمستخدمين رسائل بريدية أو تحديثات أو نشرات إخبارية أو رسائل تتعلق بالخدمات أو المحتوى الجديد أو العروض أو الشركاء، إذا كان ذلك مسموحًا وفقًا للقانون أو بناءً على موافقة المستخدم.\u003c/p\u003e\u003cp\u003eيمكن للمستخدم في أي وقت إلغاء الاشتراك من خلال:\u003c/p\u003e\u003cp\u003e• رابط إلغاء الاشتراك الموجود في الرسائل.\u003c/p\u003e\u003cp\u003e• إعدادات الحساب الشخصي، إذا كانت متاحة.\u003c/p\u003e\u003cp\u003e• إرسال طلب إلى: dpo@i24news.tv\u003c/p\u003e\u003cp\u003eقد تستمر الشركة في إرسال رسائل غير تسويقية ضرورية، مثل رسائل متعلقة بالحساب، الأمن، التحديثات القانونية، أو إدارة الاشتراك.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e7. مشاركة البيانات مع أطراف ثالثة\u003c/p\u003e\u003cp\u003eقد تشارك الشركة البيانات الشخصية، بالقدراللازم فقط، مع الجهات التالية:\u003c/p\u003e\u003cp\u003e7.1 مزودو الخدمات التقنية\u003c/p\u003e\u003cp\u003eمثل مزودي الاستضافة، الحوسبة السحابية، الأمن السيبراني، التحليلات، الدعم التقني، إدارة قواعد البيانات، وخدمات البنية التحتية.\u003c/p\u003e\u003cp\u003eمثال على ذلك:\u003c/p\u003e\u003cp\u003ehttps://azure.microsoft.com/en-us/global-infrastructure/regions/\u003c/p\u003e\u003cp\u003e7.2 مزودو الدفع والاشتراكات\u003c/p\u003e\u003cp\u003eمثل Apple وGoogle وCleeng، وفقًا لشروطهم وسياساتهم الخاصة.\u003c/p\u003e\u003cp\u003e7.3 مزودو الإعلانات والتحليلات\u003c/p\u003e\u003cp\u003eقد تتم مشاركة بيانات مجمعة، مجهولة أو مستعارة مع شركاء إعلان أو قياس أداء، بهدف تحليل الحملات وتحسين عرض الإعلانات.\u003c/p\u003e\u003cp\u003e7.4 جهات قانونية أو تنظيمية\u003c/p\u003e\u003cp\u003eقد تقوم الشركة بالكشف عن بيانات إذا كان ذلك مطلوبًا بموجب القانون، أو أمر قضائي، أو طلب من جهة مختصة، أو لحماية حقوق الشركة أو المستخدمين أو الجمهور.\u003c/p\u003e\u003cp\u003e7.5 شركات مرتبطة أو خلفاء قانونيون\u003c/p\u003e\u003cp\u003eفي حال إعادة هيكلة، دمج، نقل نشاط، بيع أصول، أو أي عملية مشابهة، قد يتم نقل البيانات إلى الجهة الخلف أو الكيان المرتبط، وفقًا للقانون.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e8. نقل البيانات خارج إسرائيل\u003c/p\u003e\u003cp\u003eقد يتم تخزين أو معالجة أو نقل البيانات الشخصية داخل إسرائيل أو خارجها، بما في ذلك من خلال مزودي خدمات دوليين مثل خدمات السحابة، التحليلات، الدفع أو الدعم التقني.\u003c/p\u003e\u003cp\u003eعند نقل البيانات خارج إسرائيل، تعمل شركة MIDDLE EAST NEWS – I24 Ltd على اتخاذ تدابير معقولة لضمان حماية البيانات وفقًا للقانون الإسرائيلي المعمول به، وبما يتناسب مع طبيعة البيانات والخدمات.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e9. أمن البيانات\u003c/p\u003e\u003cp\u003eتتخذ شركة MIDDLE EAST NEWS – I24 Ltd تدابير تقنية وتنظيمية معقولة بهدف حماية البيانات الشخصية من:\u003c/p\u003e\u003cp\u003e• الوصول غير المصرح به.\u003c/p\u003e\u003cp\u003e• الفقدان.\u003c/p\u003e\u003cp\u003e• التعديل غير المشروع.\u003c/p\u003e\u003cp\u003e• الإفصاح غير المصرح به.\u003c/p\u003e\u003cp\u003e• الاستخدام غير القانوني.\u003c/p\u003e\u003cp\u003e• التدمير أو التلف.\u003c/p\u003e\u003cp\u003eومع ذلك، لا توجد أي وسيلة نقل أو تخزين عبر الإنترنت تضمن أمانًا مطلقًا. لذلك، لا يمكن للشركة ضمان حماية كاملة ومطلقة ضد جميع المخاطر.\u003c/p\u003e\u003cp\u003eيلتزم المستخدم بالحفاظ على سرية بيانات الدخول الخاصة به، واستخدام كلمات مرور قوية، وعدم مشاركة الحساب مع أي طرف آخر.\u003c/p\u003e\u003cp\u003eفي حال حدوث حادث أمني جوهري يتعلق بالبيانات الشخصية، ستتعامل الشركة معه وفقًا للقانون الإسرائيلي المعمول به وأي التزامات إخطار قد تنطبق.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e10. مدة الاحتفاظ بالبيانات\u003c/p\u003e\u003cp\u003eتحتفظ شركة MIDDLE EAST NEWS – I24 Ltd بالبيانات الشخصية فقط للمدة اللازمة لتحقيق الأغراض التي جمعت من أجلها، أو للمدة المطلوبة بموجب القانون.\u003c/p\u003e\u003cp\u003eعلى سبيل المثال:\u003c/p\u003e\u003cp\u003e• بيانات الحساب: طوال فترة نشاط الحساب، ولمدة معقولة بعد إغلاقه عند الحاجة.\u003c/p\u003e\u003cp\u003e• بيانات التعليقات والتفاعل: طالما كان ذلك ضروريًا لإدارة المحتوى، النزاعات، أو الالتزامات القانونية.\u003c/p\u003e\u003cp\u003e• بيانات الدفع والفواتير: وفقًا للمتطلبات المحاسبية والضريبية.\u003c/p\u003e\u003cp\u003e• بيانات طلبات الحقوق أو الشكاوى: للمدة اللازمة لمعالجة الطلب وحماية الحقوق القانونية.\u003c/p\u003e\u003cp\u003e• ملفات تعريف الارتباط: عادة حتى 13 شهرًا.\u003c/p\u003e\u003cp\u003eبعد انتهاء الحاجة إلى البيانات، قد تقوم الشركة بحذفها، إخفاء هويتها، أو أرشفتها بشكل آمن إذا كان ذلك ضروريًا.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e11. حقوق المستخدم\u003c/p\u003e\u003cp\u003eوفقًا للقانون الإسرائيلي المعمول به، قد يكون للمستخدم حقوق معينة بخصوص بياناته الشخصية، بما في ذلك:\u003c/p\u003e\u003cp\u003e• طلب الاطلاع على البيانات الشخصية المتعلقة به.\u003c/p\u003e\u003cp\u003e• طلب تصحيح بيانات غير دقيقة أو غير محدثة.\u003c/p\u003e\u003cp\u003e• طلب حذف بيانات، حيثما يسمح القانون بذلك.\u003c/p\u003e\u003cp\u003e• طلب تقييد أو وقف بعض أنواع المعالجة، حيثما ينطبق ذلك.\u003c/p\u003e\u003cp\u003e• الاعتراض على استخدام البيانات لأغراض تسويقية.\u003c/p\u003e\u003cp\u003e• سحب الموافقة، عندما تكون المعالجة مبنية على الموافقة.\u003c/p\u003e\u003cp\u003eيمكن ممارسة هذه الحقوق عبر التواصل مع الشركة على:\u003c/p\u003e\u003cp\u003edpo@i24news.tv\u003c/p\u003e\u003cp\u003eأو\u003c/p\u003e\u003cp\u003econtact@i24news.tv\u003c/p\u003e\u003cp\u003eقد تطلب الشركة معلومات إضافية للتحقق من هوية مقدم الطلب قبل معالجة الطلب.\u003c/p\u003e\u003cp\u003eتحتفظ الشركة بحق رفض الطلبات التي تكون غير مبررة، متكررة بشكل مفرط، تعسفية، أو تتعارض مع التزامات قانونية أو حقوق مشروعة للشركة أو أطراف ثالثة.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e12. القاصرون\u003c/p\u003e\u003cp\u003eخدمات I24NEWS ليست موجهة خصيصًا إلى القاصرين دون إشراف قانوني.\u003c/p\u003e\u003cp\u003eإذا كان المستخدم قاصرًا، يجب أن يتم استخدام الموقع أو التطبيق تحت إشراف ولي أمر أو وصي قانوني.\u003c/p\u003e\u003cp\u003eإذا علمت شركة MIDDLE EAST NEWS – I24 Ltd أنها جمعت بيانات شخصية لقاصر بصورة لا تتوافق مع القانون، فقد تتخذ إجراءات مناسبة لحذف البيانات أو تقييد استخدامها.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e13. الشبكات الاجتماعية وخدمات الطرف الثالث\u003c/p\u003e\u003cp\u003eقد يحتوي الموقع أو التطبيق على أزرار أو روابط تؤدي إلى شبكات اجتماعية مثل:\u003c/p\u003e\u003cp\u003ehttps://www.facebook.com/privacy/explanation\u003c/p\u003e\u003cp\u003ehttps://support.twitter.com/articles/20170518\u003c/p\u003e\u003cp\u003eعند استخدام هذه الأزرار أو الروابط، قد تقوم الشبكات الاجتماعية أو المنصات الخارجية بجمع بيانات عن المستخدم وفقًا لسياساتها الخاصة.\u003c/p\u003e\u003cp\u003eلا تتحكم شركة MIDDLE EAST NEWS – I24 Ltd في ممارسات الخصوصية الخاصة بهذه الجهات، ولذلك يوصى بقراءة سياسات الخصوصية وشروط الاستخدام الخاصة بها قبل استخدامها.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e14. الإعلانات وأدوات القياس\u003c/p\u003e\u003cp\u003eقد يعرض موقع وتطبيق I24NEWS إعلانات أو محتوى تجاريًا أو محتوى مخصصًا بالتعاون مع شركاء إعلان أو مزودي قياس وتحليل.\u003c/p\u003e\u003cp\u003eقد تستخدم هذه الجهات ملفات تعريف الارتباط أو أدوات مشابهة بهدف:\u003c/p\u003e\u003cp\u003e• قياس عدد مرات عرض الإعلان.\u003c/p\u003e\u003cp\u003e• قياس النقرات.\u003c/p\u003e\u003cp\u003e• تحليل فعالية الحملات.\u003c/p\u003e\u003cp\u003e• تخصيص الإعلانات.\u003c/p\u003e\u003cp\u003e• إنشاء إحصاءات تجارية.\u003c/p\u003e\u003cp\u003eيمكن للمستخدم تعديل إعدادات المتصفح أو إعدادات الجهاز للحد من بعض أدوات التتبع، مع العلم أن ذلك قد لا يمنع عرض الإعلانات بالكامل، بل قد يجعلها أقل تخصيصًا.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e15. ملفات تعريف الارتباط (Cookies) وتقنيات التتبع\u003c/p\u003e\u003cp\u003eيستخدم الموقع ملفات تعريف الارتباط (Cookies) وتقنيات مشابهة لضمان التشغيل السليم، وتحليل الاستخدام، وتخصيص المحتوى، وعرض الإعلانات ذات الصلة.\u003c/p\u003e\u003cp\u003eبعض ملفات تعريف الارتباط ضرورية لعمل الموقع، بينما تُستخدم ملفات أخرى لأغراض القياس، والإعلانات، والتخصيص.\u003c/p\u003e\u003cp\u003eيمكن للمستخدم إدارة إعدادات ملفات تعريف الارتباط من خلال المتصفح أو عبر آلية إدارة الموافقات المتاحة على الموقع.\u003c/p\u003e\u003cp\u003ehttps://www.i24news.tv/en/cookie-list\u003c/p\u003e\u003cp\u003eيمكن للمستخدم التحكم في ملفات تعريف الارتباط من خلال إعدادات المتصفح.\u003c/p\u003e\u003cp\u003e\u0026nbsp;يتحمل المستخدم مسؤولية ضبط إعدادات جهازه أو متصفحه وفقًا لتفضيلاته.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e16. الدفع عبر أطراف ثالثة\u003c/p\u003e\u003cp\u003eعند الاشتراك في خدمات مدفوعة، قد يتم توجيه المستخدم إلى مزودي دفع خارجيين مثل Apple أو Google أو Cleeng.\u003c/p\u003e\u003cp\u003eتخضع عمليات الدفع لشروط وسياسات هؤلاء المزودين، ولا تتحكم شركة MIDDLE EAST NEWS – I24 Ltd في كامل عملية الدفع أو البيانات المالية التي تتم معالجتها من قبلهم.\u003c/p\u003e\u003cp\u003eتؤكد الشركة أنها لا تحتفظ ببيانات بطاقة الدفع الكاملة في أنظمتها، إلا إذا كان ذلك منصوصًا عليه صراحة ووفقًا للقانون.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e17. تعديل سياسة حماية البيانات الشخصية\u003c/p\u003e\u003cp\u003eتحتفظ شركة MIDDLE EAST NEWS – I24 Ltd بحق تعديل هذه السياسة في أي وقت، بما في ذلك بسبب تغييرات قانونية، تنظيمية، تقنية، تشغيلية أو تجارية.\u003c/p\u003e\u003cp\u003eتدخل النسخة المحدثة حيز التنفيذ عند نشرها على الموقع أو التطبيق، ما لم يذكر خلاف ذلك.\u003c/p\u003e\u003cp\u003eاستمرار استخدام الموقع أو التطبيق بعد نشر التعديلات يعتبر موافقة على السياسة المحدثة.\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e18. الاتصال بالشركة\u003c/p\u003e\u003cp\u003eلأي سؤال أو طلب متعلق بسياسة حماية البيانات الشخصية أو معالجة البيانات، يمكن التواصل مع شركة MIDDLE EAST NEWS – I24 Ltd عبر:\u003c/p\u003e\u003cp\u003eالبريد العام:\u003c/p\u003e\u003cp\u003econtact@i24news.tv\u003c/p\u003e\u003cp\u003eمسائل الخصوصية وحماية البيانات:\u003c/p\u003e\u003cp\u003edpo@i24news.tv\u003c/p\u003e\u003cp\u003eالعنوان:\u003c/p\u003e\u003cp\u003eHangar 1, Jaffa Port\u003c/p\u003e\u003cp\u003eTel Aviv-Jaffa\u003c/p\u003e\u003cp\u003eISRAEL\u003c/p\u003e\u003cp\u003e________________________________________\u003c/p\u003e\u003cp\u003e19. القانون المطبق و
