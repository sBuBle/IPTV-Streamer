name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run worker:build
        env:
          WRANGLER_SEND_METRICS: "false"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t israeli-tv-addon .
      - name: Smoke test the image
        run: |
          docker run -d --name addon -p 7000:7000 -e HEALTH_PROBE_INTERVAL_MIN=0 israeli-tv-addon
          for i in $(seq 1 20); do curl -fs localhost:7000/health && break; sleep 1; done
          curl -fs localhost:7000/manifest.json
          curl -fs localhost:7000/catalog/tv/iltv-live.json | grep -q knesset-99
          docker exec addon ffprobe -version | head -1
